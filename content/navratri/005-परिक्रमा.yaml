title: परिक्रमा
lyrics:
  sthayi_connect: false
  paragraphs:
    - |
      सुधा सिन्धोर्मध्ये सुरविट पिवाटी परिवृते, 
      मणिद्वीपे नीपो पवनवति चिन्तामणिगृहे।
    - |
      शिवा कारे मंचे, परमशिव-पर्यङ्क-निलयाम्, 
      भजन्ति त्वां धन्या:, कतिचन चिदानन्दलहरीम्।
    - |
      मुखे ते ताम्बूलं, नयनयुगले कज्जल कलया, 
      ललाटे काश्मीरं, विलसति गले मौक्तिक लता।
    - |
      स्फुरत् काञ्ची शाटी, पृथु कटितटे हाटकमयी, 
      भजामि त्वां गौरीं, नगपतिकिशोरीम् अविरतम्।
    - commentary: |
      सुधा समुद्र के मध्य में स्थित, कल्पवृक्षों से घिरे हुए अति सुंदर मणिद्वीप में, कल्पवृक्ष की सुगन्धित पवन से युक्त चिंतामणि रूपी महल में, शिव रूपी मंच पर और परमशिव रूपी पलंग पर निवास करने वाली, हे चिदानंद की लहर रूपिणी देवी! आपके मुख में तांबूल, दोनों नेत्रों में काजल की सुंदरता, माथे पर केसर का तिलक और गले में मोतियों की सुंदर माला सुशोभित हो रही है; तथा जिनके विशाल कटिभाग (कमर) पर स्वर्णमयी साड़ी और चमकती हुई करधनी सुशोभित है, उन पर्वतराज हिमालय की पुत्री भगवती गौरी (त्रिपुरसुंदरी) का मैं निरंतर निष्ठापूर्वक भजन और ध्यान करता हूँ।
  post_shlok: |
    यानि कानि च पापानि, जन्म जन्मान्तर कृतानि च, 
    तानि सर्वाणि नश्यन्तु, प्रदक्षिणां पदे पदे।
