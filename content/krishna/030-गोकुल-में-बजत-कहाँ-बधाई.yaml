title: गोकुल में बजत कहाँ बधाई
lyrics:
  sthayi: |
    गोकुल में बजत कहाँ बधाई,
    भीड़ भई है नंद जी के द्वारे,
    अष्ट महासिद्धि आई।
  paragraphs:
    - |
      ब्रह्मादिक रुद्रादिक जाकी,
      चरण रेनू नहीं पाई,
      सोयी नंद जी को पूत कहावत,
      कौतुक सुनो मोरी माई।
    - |
      ध्रुव अंबरीश प्रहलाद विभीषण,
      नित नित महिमा गाई,
      सोयी हरि परमानंद को ठाकुर,
      बृजजन के धिकराय।
