title: श्री कृष्ण गोविन्द हरे मुरारी
lyrics:
  sthayi: |
    श्री कृष्ण गोविन्द हरे मुरारी, हे नाथ नारायण वासुदेवा।
    पितु मात स्वामी, सखा हमारे, हे नाथ नारायण वासुदेवा॥
  paragraphs:
    - |
      बंदी गृह के तुम अवतारी, कही जन्मे, कही पले मुरारी,
      किसी के जाये, किसी के कहाये, है अद्भुद हर बात तिहारी, है अद्भुद, हर बात तिहारी,
      गोकुल में चमके, मथुरा के तारे, हे नाथ नारायण वासुदेवा॥
    - |
      अधर पे बंशी, ह्रदय में राधे, बट गए दोनों में, आधे आधे,
      हे राधा नागर, हे भक्त वत्सल, सदैव भक्तों के, काम साधे, सदैव भक्तों के, काम साधे,
      वही गए वही, जहाँ गए पुकारे, हे नाथ नारायण वासुदेवा॥
    - |
      गीता में उपदेश सुनाया, धर्म युद्ध को धर्म बताया,
      कर्म तू कर मत रख फल की इच्छा, यह सन्देश तुम्ही से पाया
      अमर है गीता के बोल सारे, हे नाथ नारायण वासुदेवा ॥
