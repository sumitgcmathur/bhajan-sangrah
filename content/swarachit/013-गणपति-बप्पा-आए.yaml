title: गणपति बप्पा आए
group: गणपति भजन
lyrics:
  sthayi: |
    भादव महीना आया, दिन चतुर्थी खास है,
    गणपति बप्पा आए, बड़ा ये त्योहार है॥
  sthayi_connect_text: गणपति बप्पा आए, बड़ा ये त्योहार है
  paragraphs:
    - |
      सजी हैं अब तो सारी गलियाँ, रौनक चारों ओर है,
      ढोल नगाड़े बजते जाएँ, गूँजे जय-जयकार है।
      मोदक का भोग लगाएँ, खुशियों की बहार है।
    - |
      सब देवों में होड़ लगी थी, प्रथम पूजा के अधिकार की,
      लगा के फेरी माता-पिता की, मूषक की थी करी सवारी,
      बुद्धि का पाठ पढ़ाया, रिद्धि सिद्धि के दातार ने।
